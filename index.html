<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 카카오톡 미리보기 및 브라우저 탭 제목 설정 -->
<meta property="og:title" content="M2-L_8 MP3">
<meta property="og:description" content="클릭하여 교재 음원 및 영상을 재생하세요">
<title>M2-L_8 MP3</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 650px; margin: 20px auto; padding: 0 15px; background: #f8f9fa; }
  h2 { color: #222; border-bottom: 2px solid #0066cc; padding-bottom: 8px; word-break: break-word; }
  .folder-btn { display: block; width: 100%; text-align: left; padding: 14px; margin: 8px 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .folder-btn:hover { background: #eef5ff; border-color: #0066cc; }
  .section-label { margin-top: 16px; font-size: 13px; font-weight: bold; color: #555; }
  .track-list { margin-top: 8px; }
  .track-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 14px; margin: 6px 0; border-radius: 6px; border: 1px solid #e0e0e0; cursor: pointer; }
  .track-item:hover { border-color: #0066cc; background: #f5f9ff; }
  .track-item.active { background: #0066cc; color: #fff; font-weight: bold; border-color: #0066cc; }
  .player-box { position: sticky; top: 0; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; z-index: 10; }
  audio { width: 100%; margin-top: 8px; }
  video { width: 100%; max-height: 360px; background: #000; border-radius: 6px; margin-top: 8px; }
  .speed-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .speed-label { font-size: 13px; font-weight: bold; color: #555; margin-right: 2px; }
  .speed-btn { padding: 5px 10px; border: 1px solid #ccc; background: #f8f9fa; color: #333; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .speed-btn:hover { border-color: #0066cc; background: #eef5ff; }
  .speed-btn.active { background: #0066cc; color: #fff; border-color: #0066cc; }
  .back-btn { background: #555; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
  .back-btn:hover { background: #333; }
</style>
</head>
<body>

<h2 id="title">음원 목록</h2>
<div class="player-box" id="playerBox" style="display:none;">
  <div id="nowPlaying" style="font-weight:bold; font-size:14px;">재생할 파일을 선택하세요</div>
  <audio id="audioPlayer" controls style="display:none;"></audio>
  <video id="videoPlayer" controls playsinline style="display:none;"></video>
  <div class="speed-bar">
    <span class="speed-label">재생 속도:</span>
    <button type="button" class="speed-btn active" data-rate="1" onclick="setSpeed(1)">1배속</button>
    <button type="button" class="speed-btn" data-rate="0.8" onclick="setSpeed(0.8)">0.8배속</button>
    <button type="button" class="speed-btn" data-rate="0.6" onclick="setSpeed(0.6)">0.6배속</button>
  </div>
</div>
<div id="content">불러오는 중...</div>

<script>
const USER = "jonmiraen72";
const REPO = location.pathname.split('/')[1] || "M2-L_8";
const API_BASE = `https://api.github.com/repos/${USER}/${REPO}/contents`;

let currentMedia = []; // { name, type: 'audio' | 'video', download_url }
let currentIndex = -1;
let currentRate = 1.0;
let pathStack = []; // { path: string, label: string }

const playerBox = document.getElementById("playerBox");
const nowPlaying = document.getElementById("nowPlaying");
const audio = document.getElementById("audioPlayer");
const video = document.getElementById("videoPlayer");

document.getElementById("title").innerText = `${REPO} 음원 목록`;

function setSpeed(rate) {
  currentRate = rate;
  audio.playbackRate = rate;
  video.playbackRate = rate;
  document.querySelectorAll(".speed-btn").forEach(btn => {
    btn.classList.toggle("active", parseFloat(btn.dataset.rate) === rate);
  });
}

function stopAllMedia() {
  audio.pause();
  audio.currentTime = 0;
  audio.removeAttribute("src");
  audio.load();

  video.pause();
  video.currentTime = 0;
  video.removeAttribute("src");
  video.load();

  audio.style.display = "none";
  video.style.display = "none";
  currentIndex = -1;
  nowPlaying.innerText = "재생할 파일을 선택하세요";
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function naturalCompare(a, b) {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
}

function encodeRepoPath(repoPath) {
  if (!repoPath) return "";
  return repoPath.split("/").filter(Boolean).map(seg => encodeURIComponent(seg)).join("/");
}

function getMediaType(fileName) {
  const lower = fileName.toLowerCase();
  if (lower.endsWith(".mp3")) return "audio";
  if (lower.endsWith(".mp4")) return "video";
  return null;
}

async function openPath(repoPath = "", label = `${REPO} Unit 선택`, pushHistory = true) {
  stopAllMedia();

  const cleanPath = repoPath.replace(/^\/+|\/+$/g, "");
  if (pushHistory) {
    pathStack.push({ path: cleanPath, label });
  }

  document.getElementById("title").innerText = cleanPath ? label : `${REPO} Unit 선택`;
  document.getElementById("content").innerHTML = "불러오는 중...";

  const endpoint = cleanPath ? `${API_BASE}/${encodeRepoPath(cleanPath)}` : API_BASE;

  try {
    const res = await fetch(endpoint);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error("Invalid response");

    const folders = items
      .filter(item => item.type === "dir")
      .sort((a, b) => naturalCompare(a.name, b.name));

    currentMedia = items
      .filter(item => item.type === "file" && getMediaType(item.name) !== null)
      .map(item => ({
        name: item.name,
        type: getMediaType(item.name),
        download_url: item.download_url
      }))
      .sort((a, b) => naturalCompare(a.name, b.name));

    currentIndex = -1;

    let html = "";
    if (pathStack.length > 1) {
      html += `<button type="button" class="back-btn" onclick="goBack()">← 이전 폴더</button>`;
    }

    if (folders.length > 0) {
      if (currentMedia.length > 0) {
        html += `<div class="section-label">하위 폴더</div>`;
      }
      folders.forEach(f => {
        const safePathAttr = escapeHtml(f.path);
        const safeLabelAttr = escapeHtml(f.name);
        const safeText = escapeHtml(f.name);
        html += `<button type="button" class="folder-btn" onclick="openPath('${safePathAttr}', '${safeLabelAttr}')">📁 ${safeText}</button>`;
      });
    }

    if (currentMedia.length > 0) {
      if (folders.length > 0) {
        html += `<div class="section-label">음원 / 영상 파일</div>`;
      }
      html += `<div class="track-list">`;
      currentMedia.forEach((m, idx) => {
        const icon = m.type === "video" ? "🎬" : "🎵";
        const safeName = escapeHtml(m.name);
        html += `<div class="track-item" id="track-${idx}" onclick="playMedia(${idx})"><span>${icon} ${safeName}</span><span>▶</span></div>`;
      });
      html += `</div>`;
      playerBox.style.display = "block";
    } else {
      playerBox.style.display = "none";
    }

    if (folders.length === 0 && currentMedia.length === 0) {
      html += `<p>재생할 MP3 또는 MP4 파일이 없습니다.</p>`;
    }

    document.getElementById("content").innerHTML = html;
  } catch (err) {
    playerBox.style.display = "none";
    let errHtml = "";
    if (pathStack.length > 1) {
      errHtml += `<button type="button" class="back-btn" onclick="goBack()">← 이전 폴더</button>`;
    }
    errHtml += `<p>데이터를 불러오는 중 오류가 발생했습니다.</p>`;
    document.getElementById("content").innerHTML = errHtml;
  }
}

function goBack() {
  stopAllMedia();
  if (pathStack.length > 1) {
    pathStack.pop();
    const prev = pathStack[pathStack.length - 1];
    openPath(prev.path, prev.label, false);
  }
}

function playMedia(idx) {
  const item = currentMedia[idx];
  if (!item) return;

  stopAllMedia();
  currentIndex = idx;

  document.querySelectorAll(".track-item").forEach(el => el.classList.remove("active"));
  const activeEl = document.getElementById(`track-${idx}`);
  if (activeEl) activeEl.classList.add("active");

  nowPlaying.innerText = `재생 중: ${item.name}`;

  if (item.type === "video") {
    video.style.display = "block";
    video.src = item.download_url;
    video.playbackRate = currentRate;
    video.play().then(() => {
      video.playbackRate = currentRate;
    }).catch(() => {});
  } else {
    audio.style.display = "block";
    audio.src = item.download_url;
    audio.playbackRate = currentRate;
    audio.play().then(() => {
      audio.playbackRate = currentRate;
    }).catch(() => {});
  }
}

openPath("", `${REPO} Unit 선택`, true);
</script>
</body>
</html>
